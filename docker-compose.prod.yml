# Production overrides — run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  app:
    image: ${IMAGE_FULL:-ghcr.io/itneutronsblog/devops-learning-web:latest}
    volumes:
      - video_data:/data/videos
    environment:
      - NODE_ENV=production
      - PORT=3005
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-devops-videos}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    deploy:
      resources:
        limits:
          cpus: '0.9'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  nginx:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always
