# ═══════════════════════════════════════════════
# Auto Failover Configuration
# ═══════════════════════════════════════════════

# Primary server (your production server)
primary:
  health_url: "http://178.128.55.28:3005/api/health"
  ssh_host: "178.128.55.28"
  ssh_user: "ubuntu"
  ssh_key: ""  # Path to SSH key for fencing (optional)

# DR server (AWS Mumbai)
dr:
  instance_id: "i-01de85f42f1e4bad6"
  region: "ap-south-1"
  compose_path: "/opt/devops-learning-web"

# Monitoring parameters
monitoring:
  check_interval: 30        # Seconds between health checks
  failure_threshold: 5      # Consecutive failures before failover (5 × 30s = 2.5 min)
  warning_threshold: 3      # Failures before sending warning notification
  health_timeout: 10        # Seconds to wait for health response
  cooldown_period: 3600     # Seconds after failover before allowing another (1 hour)

# Notification channels (leave empty to disable)
notifications:
  slack_webhook: ""                      # Slack incoming webhook URL
  email: "veeradinesh218@gmail.com"      # Email for notifications
  sns_topic_arn: ""                      # AWS SNS topic ARN (optional)

# Redis connection
redis:
  url: "redis://localhost:6379/0"
