<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal DevOps Learning Video Streaming Platform">
  <title>DevOps Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Sidebar Navigation -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="url(#logoGrad)"/>
          <polygon points="13,10 13,22 23,16" fill="white"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">DevOps<span class="logo-accent">Hub</span></span>
      </div>
    </div>

    <div class="sidebar-nav">
      <a href="#/" class="nav-item active" data-route="library" id="nav-library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Library</span>
      </a>
      <a href="#/upload" class="nav-item" data-route="upload" id="nav-upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Upload</span>
      </a>
      <a href="#/download" class="nav-item" data-route="download" id="nav-download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Download</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="server-status" id="server-status">
        <div class="status-dot"></div>
        <span>Connecting...</span>
      </div>
    </div>
  </nav>

  <!-- Mobile Header -->
  <header class="mobile-header" id="mobile-header">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="mobile-title">DevOps<span class="logo-accent">Hub</span></span>
  </header>

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Content Area -->
  <main class="main-content" id="main-content">
    <!-- Dynamic content injected here by router -->
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/library.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
