services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-learning-db-prod
    environment:
      POSTGRES_DB: devops_learning
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_learning"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devops-learning-app
    ports:
      - "3005:3005"
    volumes:
      - video_data:/data/videos
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATA_DIR=/data/videos
      - DATABASE_URL=postgres://devops:${POSTGRES_PASSWORD:-devops_secret}@postgres:5432/devops_learning
      - FRONTEND_DIR=/app/public
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-devops-videos}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: devops-learning-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html:ro
      - video_data:/data/videos:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pg_data:
    labels:
      - "keep=true"
  video_data:
    labels:
      - "keep=true"
