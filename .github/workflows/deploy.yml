name: Deploy to Production
on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: itneutronsblog/devops-learning-web
  DEPLOY_DIR: ~/devops-learning-web

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.prod.yml,nginx/"
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            # Write .env from GitHub Secrets (never stored in repo)
            cat > .env << 'ENVEOF'
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            ENVEOF
            # Trim leading whitespace from heredoc
            sed -i 's/^[[:space:]]*//' .env

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Use latest tag (pushed on every main build)
            export IMAGE_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            # Pull the new image
            docker pull ${IMAGE_FULL}

            # Stop existing containers gracefully
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --timeout 30 2>/dev/null || true

            # Start with new image
            IMAGE_FULL=${IMAGE_FULL} docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Give container time to start
            echo "Waiting 15s for container startup..."
            sleep 15

            # Debug: show container status and logs
            echo "=== Container Status ==="
            docker compose ps
            echo "=== App Container Logs ==="
            docker logs devops-learning-app 2>&1 | tail -50

            # Wait for health check (max 60s)
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3005/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "  Attempt $i/12 — waiting 5s..."
              sleep 5
            done

            # Health check failed — show logs for debugging
            echo "❌ Health check failed!"
            echo "=== FULL APP LOGS ==="
            docker logs devops-learning-app 2>&1
            echo "=== NGINX LOGS ==="
            docker logs devops-learning-nginx 2>&1 | tail -20
            exit 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== Container status ==="
            cd ${{ env.DEPLOY_DIR }}
            docker compose ps
            echo "=== Health ==="
            curl -s http://localhost:3005/api/health | python3 -m json.tool || true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to production FAILED for commit ${{ github.sha }}"
